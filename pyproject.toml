[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fre-cli"
description = "Command Line Interface for FRE commands"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "MSD Workflow Team", email="oar.gfdl.workflow@noaa.gov"}
]

keywords = [
    "gfdl",
    "workflow",
    "fre",
    "fms",
]

# ---------------------------------------------------------
# Standard Python dependencies (what pip would install)
# ---------------------------------------------------------

dependencies = [
    "cftime",
    "click>=8.2",
    "jinja2>=3",
    "jsonschema",
    "numpy>=2.0.0",
    "pyyaml",
    "xarray>=2024.0.0",
    "netCDF4>=1.7.0",
]

classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

dynamic = [
    "version"
]


[tool.setuptools.dynamic]
version = {attr = "fre.__version__"}

[project.scripts]
fre = 'fre.fre:fre'

[project.optional-dependencies]
docs = [
    "sphinx",
    "renku-sphinx-theme",
    "sphinx-rtd-theme",
]

test = [
    "pylint",
    "pytest",
    "pytest-cov",
]


[tool.setuptools.packages.find]
include = ["fre", "fre.*"]


# =========================================================
# PIXI CONFIGURATION (Replaces environment.yaml)
# =========================================================
[tool.pixi.project]
channels = ["conda-forge", "noaa-gfdl"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
# These are the Conda-specific packages, C-binaries, and GFDL
# specific tools that PyPI/pip cannot handle natively.
analysis_scripts = "0.0.1.*"
catalogbuilder = "2025.01.01.*"
cdo = ">=2"
cmor = ">=3.14"
cylc-flow = ">=8.2"
cylc-rose = "*"
metomi-rose = "*"
nccmp = "*"
python-cdo = "*"

[tool.pixi.pypi-dependencies]
fre-cli = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
# You can define custom shortcuts here for your dev team
test = "pytest --durations=20 --log-level INFO --ignore=fre/make/tests/compilation fre/"
lint = "pylint --rcfile pylintrc fre/"
